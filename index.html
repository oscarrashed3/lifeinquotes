#arm { position: absolute; left: 1117.2px; top: 311.7px; width: 183.9px; height: 599.6px; max-width: none; transform-origin: 81.7px 134.9px; filter: brightness(0.9) drop-shadow(10px 14px 8px rgba(0,0,0,0.5)); }

      }
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 700;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 6000;
      crackleGain = ac.createGain(); crackleGain.gain.value = 0;
      src.connect(hp).connect(lp).connect(crackleGain).connect(ac.destination); src.start();
    } catch (err) { ac = null; }
  }
  function needleDrop() {
    if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.18);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.32);
  }
  const crackle = (on) => { if (crackleGain) crackleGain.gain.setTargetAtTime(on ? 0.5 : 0, ac.currentTime, on ? 0.4 : 0.25); };

  /* ---------- Spotify (works when hosted on your own site) ---------- */
  const sp = { api: null, ctrl: null, failed: false, wanted: null, uri: null };
  const trackId = (link) => { const m = String(link || "").match(/track[/:]([A-Za-z0-9]{22})/); return m ? m[1] : null; };
  const spotifyHref = (r) => trackId(r.spotify) ? `https://open.spotify.com/track/${trackId(r.spotify)}` : `https://open.spotify.com/search/${encodeURIComponent((r.song || "") + " " + (r.artist || ""))}`;
  (function loadSpotify() {
    const s = document.createElement("script");
    s.src = "https://open.spotify.com/embed/iframe-api/v1"; s.async = true;
    s.onerror = () => { sp.failed = true; };
    window.onSpotifyIframeApiReady = (API) => { sp.api = API; };
    document.head.appendChild(s);
    setTimeout(() => { if (!sp.api) sp.failed = true; }, 6000);
  })();
  function preloadSpotify(r) {
    if (r.audio) { sp.wanted = null; return; }
    const id = trackId(r.spotify);
    sp.wanted = id ? `spotify:track:${id}` : null;
    if (!sp.api || !sp.wanted) return;
    if (!sp.ctrl) {
      sp.api.createController($("spotifyMount"), { uri: sp.wanted, width: "100%", height: 80 }, (c) => {
        sp.ctrl = c; sp.uri = sp.wanted;
        c.addListener("playback_update", (e) => {
          const p = e.data || {};
          if (st.mode !== "deck") return;
          setPlaying(!p.isPaused);
          if (p.duration && p.position >= p.duration - 400 && !p.isPaused) endOfSide();
        });
      });
    } else if (sp.uri !== sp.wanted) { sp.ctrl.loadUri(sp.wanted); sp.uri = sp.wanted; }
  }
  const useSpotify = () => !!(sp.api && sp.ctrl && sp.wanted);
  let crackleTimer = 0;
  function setPlaying(on) {
    st.playing = on;
    spin.target = on ? RPM_DEG : 0;
    crackle(on);
    clearTimeout(crackleTimer);
    const cur = RECORDS[st.onDeck];
    if (on && cur && (cur.audio || useSpotify())) crackleTimer = setTimeout(() => { if (st.playing) crackle(false); }, 2000);
    $("icPause").style.display = on ? "" : "none";
    $("icPlay").style.display = on ? "none" : "";
    $("spinBtn").setAttribute("aria-label", on ? "Pause the record" : "Play the record");
  }
  /* ---------- Song excerpts from your own MP3 files ---------- */
  const mx = { el: null, lp: null, gain: null, r: null, endAt: 0, fading: false };
  function musicChain() {
    if (mx.el || !ac) return !!mx.el;
    mx.el = new Audio(); mx.el.preload = "auto";
    try {
      const src = ac.createMediaElementSource(mx.el);
      mx.lp = ac.createBiquadFilter(); mx.lp.type = "lowpass"; mx.lp.frequency.value = 20000;
      mx.gain = ac.createGain(); mx.gain.gain.value = 0;
      src.connect(mx.lp).connect(mx.gain).connect(ac.destination);
    } catch (err) { mx.lp = mx.gain = null; }
    mx.el.addEventListener("timeupdate", () => {
      if (!mx.r || st.mode !== "deck") return;
      const left = mx.endAt - mx.el.currentTime;
      if (left < 2.2 && !mx.fading) { mx.fading = true; fadeMusic(0, 1.6); }
      if (left <= 0) { mx.el.pause(); endOfSide(); }
    });
    mx.el.addEventListener("ended", () => { if (st.mode === "deck") endOfSide(); });
    return true;
  }
  function fadeMusic(to, secs) {
    if (mx.gain) mx.gain.gain.setTargetAtTime(to, ac.currentTime, secs / 3);
    else if (mx.el) mx.el.volume = to;
  }
  function playExcerpt(r) {
    if (!musicChain()) return false;
    mx.r = r; mx.fading = false;
    const start = Number(r.start) || 0, len = Number(r.length) || 0;
    const go = () => {
      try { mx.el.currentTime = start; } catch (err) {}
      mx.endAt = len > 0 ? start + len : Infinity;
      if (mx.lp) { mx.lp.frequency.cancelScheduledValues(ac.currentTime); mx.lp.frequency.setValueAtTime(800, ac.currentTime); mx.lp.frequency.exponentialRampToValueAtTime(20000, ac.currentTime + 1.2); }
      if (mx.gain) mx.gain.gain.setValueAtTime(0, ac.currentTime);
      fadeMusic(0.9, 1.5);
      mx.el.play().then(() => setPlaying(true)).catch(() => { setPlaying(false); live("Press play in the panel to start the song."); });
    };
    if (mx.el.getAttribute("src") !== r.audio) { mx.el.src = r.audio; mx.el.addEventListener("loadedmetadata", go, { once: true }); mx.el.load(); }
    else if (mx.el.readyState < 1) mx.el.addEventListener("loadedmetadata", go, { once: true });
    else go();
    return true;
  }

  function startMusic(r) {
    const own = !!r.audio;
    const spotify = !own && useSpotify();
    $("spotifyEmbed").hidden = !spotify;
    $("fallbackPlayer").hidden = spotify;
    setPlaying(true);
    if (own) { if (!playExcerpt(r)) setPlaying(true); }
    else if (spotify) { try { sp.ctrl.play(); } catch (err) { /* the embed's own play button still works */ } }
  }
  function stopMusic() {
    setPlaying(false);
    if (mx.el && !mx.el.paused) { fadeMusic(0, 0.4); const el = mx.el; setTimeout(() => el.pause(), 450); }
    if (sp.ctrl) { try { sp.ctrl.pause(); } catch (err) {} }
  }
  function endOfSide() {
    setPlaying(false);
    gsap.timeline().to(armState, { lift: 1, duration: T(0.2), onUpdate: drawArm }).add(tweenArm(ARM_REST, 1)).to(armState, { lift: 0, duration: T(0.2), onUpdate: drawArm });
  }

  /* ---------- Progress bar: time code and scrubbing ---------- */
  const seek = $("seek"), tCur = $("tCur"), tDur = $("tDur");
  let seeking = false;
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  function paintSeek(cur, d) {
    seek.style.setProperty("--p", (d > 0 ? Math.min(100, (cur / d) * 100) : 0) + "%");
    tCur.textContent = fmt(cur);
    seek.setAttribute("aria-valuetext", `${fmt(cur)} of ${fmt(d)}`);
  }
  function syncFilm(r, ok) {
    const film = $("pFilm");
    if (!film || !film.dataset.src) return;
    const on = ok && r.panelVideo && st.mode === "deck" && !mx.el.paused;
    if (!on) { if (!film.paused) film.pause(); return; }
    if (film.readyState < 1) return;
    const t = Math.min(mx.el.currentTime, (film.duration || 1e9) - 0.05);
    if (Math.abs(film.currentTime - t) > 0.25) { try { film.currentTime = t; } catch (err) {} }
    if (film.paused) film.play().catch(() => {});
  }
  function updateSeek() {
    const r = RECORDS[st.onDeck];
    const ok = !!(r && r.audio && mx.el && mx.r === r && isFinite(mx.el.duration) && mx.el.duration > 0);
    seek.disabled = !ok;
    syncFilm(r, ok);
    if (!ok) { if (!seeking) { seek.value = 0; paintSeek(0, 0); tDur.textContent = "0:00"; } return; }
    const d = mx.el.duration;
    if (+seek.max !== Math.floor(d)) seek.max = Math.floor(d);
    tDur.textContent = fmt(d);
    if (!seeking) { seek.value = mx.el.currentTime; paintSeek(mx.el.currentTime, d); }
  }
  seek.addEventListener("input", () => { seeking = true; paintSeek(+seek.value, mx.el ? mx.el.duration : 0); });
  seek.addEventListener("change", () => {
    if (mx.el && isFinite(mx.el.duration)) {
      mx.el.currentTime = Math.min(+seek.value, mx.el.duration - 0.25);
      mx.fading = false;
      if (st.playing) fadeMusic(0.9, 0.15);
    }
    seeking = false;
  });
  ["pointerup", "pointercancel", "blur"].forEach((ev) => seek.addEventListener(ev, () => { if (seeking) seek.dispatchEvent(new Event("change")); }));

  /* ---------- Official artwork, served by Spotify (works when hosted on your own site) ---------- */
  function refreshCover(i) {
    const e = slotEls[i], r = RECORDS[i];
    e.mul.innerHTML = e.tint.innerHTML = coverHTML(r);
    if (st.sel === i && st.mode === "hand") $("cardFront").innerHTML = coverHTML(r);
    if (st.onDeck === i) $("pArt").innerHTML = coverHTML(r);
  }
  RECORDS.forEach((r, i) => {
    const id = trackId(r.spotify);
    if (!id || r.coverImage || r.interactive === false) return;
    fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent("https://open.spotify.com/track/" + id)}`)
      .then((res) => (res.ok ? res.json() : null))
      .then((j) => {
        if (!j || !/^https:\/\/[a-z0-9.-]+\.scdn\.co\//.test(j.thumbnail_url || "")) return;
        const im = new Image();
        im.onload = () => { r.art = j.thumbnail_url; refreshCover(i); };
        im.src = j.thumbnail_url;
      })
      .catch(() => { /* blocked or offline: keep the designed cover */ });
  });

  /* ---------- Controls ---------- */
  $("cardBack").addEventListener("click", (ev) => {
    if (ev.target.closest("[data-more]")) toggleGate();
    const s = ev.target.closest("[data-sound]");
    if (s && st.flipped) { const v = $("cardBack").querySelector("[data-back-video]"); if (v) { setVideoSound(v, v.muted); if (v.paused) v.play().catch(() => {}); } }
  });
  $("flipBtn").addEventListener("click", flip);
  $("playBtn").addEventListener("click", play);
  backBtn.addEventListener("click", backToRoom);
  $("panelBack").addEventListener("click", backToRoom);
  $("prevBtn").addEventListener("click", () => step(-1));
  $("nextBtn").addEventListener("click", () => step(1));
  $("spinBtn").addEventListener("click", () => {
    ensureAudio();
    const r = RECORDS[st.onDeck];
    if (st.playing) {
      setPlaying(false); gsap.to(armState, { lift: 0.6, duration: T(0.25), onUpdate: drawArm });
      if (mx.el && !mx.el.paused) { fadeMusic(0, 0.3); const el = mx.el; setTimeout(() => el.pause(), 320); }
    } else {
      gsap.to(armState, { lift: 0, duration: T(0.25), onUpdate: drawArm });
      st.armFollow = true;
      setPlaying(true);
      if (r && r.audio && mx.el) {
        if (mx.el.ended || mx.el.currentTime >= mx.endAt - 0.3 || mx.r !== r) playExcerpt(r);
        else { fadeMusic(0.9, 0.6); mx.el.play().catch(() => setPlaying(false)); }
      }
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { ev.preventDefault(); if (st.gate && st.mode === "hand" && !st.busy) gateTl(false); else backToRoom(); }
  });

  /* ---------- Fit the scene to the window ---------- */
  const stage = $("stage");
  function fit() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  }
  addEventListener("resize", fit); fit();

  /* ---------- Preload, then reveal ---------- */
  gsap.set(cardWrap, { opacity: 0 });
  const srcs = ["assets/room.jpg", "assets/room-empty.jpg", "assets/deck.jpg", "assets/vinyl.png", "assets/tonearm.png"]
    .concat(RECORDS.map((r) => r.coverImage).filter(Boolean), RECORDS.map((r) => r.backPoster).filter(Boolean));
  Promise.all(srcs.map((u) => new Promise((res) => { const im = new Image(); im.onload = im.onerror = res; im.src = u; })))
    .then(() => document.fonts ? document.fonts.ready : null)
    .then(() => {
      const l = $("loader"); l.style.opacity = 0; setTimeout(() => l.remove(), 900);
      if (!RM) gsap.from(roomCam, { scale: 1.06, duration: 2.4, ease: "power2.out" });
    });
})();
</script>

</body>
</html>
